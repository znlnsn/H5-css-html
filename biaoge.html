<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>表格</title>
</head>
<style>
  table {


    border: 1px solid #000000;
    border-collapse: collapse;
  }

  tr, td,th {
    border: 1px solid #000000;

  }
</style>
<body>
<table>
  <tr>
    <th>序号</th>
    <th>姓名</th>
    <th>性别</th>
    <th>年龄</th>
  </tr>
  <tr>
    <td>1</td>
    <td>张三</td>
    <td>男</td>
    <td>22</td>
  </tr>
  <tr>
    <td>2</td>
    <td>李四</td>
    <td>女</td>
    <td>20</td>
  </tr>
</table>
</body>
</html>
